name: Stack validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install PyYAML==6.0.3
      - run: python scripts/validate_stack.py
      - run: bash -n setup-mcp-workflows.sh
      - run: docker compose --env-file .env.example --profile mcp config --quiet
      - name: Verify published image references
        shell: bash
        run: |
          docker compose --env-file .env.example --profile mcp config --images |
          while IFS= read -r image; do
            case "$image" in btgunco-n8n:*) continue ;; esac
            docker manifest inspect "$image" > /dev/null
          done
      - name: Build custom n8n image
        run: docker compose --env-file .env.example build --pull n8n
      - name: Smoke test n8n and WebP
        run: |
          docker run --rm --entrypoint /bin/sh btgunco-n8n:2.47.5-imagemagick -ec \
            'test "$(n8n --version)" = "2.47.5"; magick -size 1x1 xc:white /tmp/test.webp; magick identify /tmp/test.webp'
